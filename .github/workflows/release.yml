name: Release

# Phase 9 — signed release build (v0.1.0).
#
# IMPORTANT: this workflow does NOT call
# khahdihdz/apksign/.github/workflows/android-shared-signing.yml,
# even though that reusable workflow exists. Four verified blockers
# (see docs/ENGINE-INTEGRATION.md §15):
#   1. It checks out the calling repo only — it never checks out
#      upstream J2ME Loader, never installs the NDK, never runs
#      tools/merge-engine.py, so the engine sources and the :dexlib
#      module are missing and Gradle configuration fails. The
#      committed settings.gradle only includes ':app'; ':dexlib' is
#      generated by the merge script at CI time.
#   2. It never creates keystore.properties, which the merged
#      app/build.gradle loads unconditionally at configuration time
#      (the pristine engine run #1 failed exactly this way).
#   3. Its default gradle task is assembleRelease, which does not
#      exist once product flavours are added (ours is
#      assembleFdroidRelease).
#   4. It looks for APKs under */build/outputs/apk/release/, but a
#      flavoured build lands in app/build/outputs/apk/fdroid/release/.
# This workflow therefore does the merge itself (same steps as
# .github/workflows/ci.yml), then signs with the same secrets the
# apksign sync provides (ANDROID_SIGNING_*) and the same PKCS12
# normalization the shared workflow uses: the store password for
# both store and key, because Java ignores a separate key password
# for PKCS12 (see the android_pkcs12_signing skill). If the shared
# workflow ever gains a pre-build hook, calling it becomes possible
# again; until then this is the working route.
#
# Triggers: a published GitHub Release (tag v0.1.0), or manual
# dispatch for a dry run of the signing (artifacts are uploaded,
# nothing is attached to a release on dispatch).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  # gh release upload attaches the signed APK to the release.
  contents: write

jobs:
  release:
    name: Build, sign and verify release APK
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: "1"
      APP_VERSION_NAME: "0.1.0"
    steps:
      - name: Check tag matches the release version
        # The build is stamped 1 / 0.1.0; a release from any other tag
        # would ship an APK whose version does not match its tag.
        if: github.event_name == 'release'
        run: |
          test "${{ github.ref_name }}" = "v${{ env.APP_VERSION_NAME }}" || {
            echo "ERROR: release tag '${{ github.ref_name }}' does not match v${{ env.APP_VERSION_NAME }}."
            echo "Create the release from tag v${{ env.APP_VERSION_NAME }} or bump APP_VERSION_NAME in this workflow."
            exit 1
          }
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # No setup-android step: ubuntu-latest already ships an Android SDK
      # (ANDROID_HOME set). android-actions/setup-android@v3 failed in our
      # CI run #1 because it tries to install the obsolete 'tools' package.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/build-tools" && ls "$ANDROID_HOME/platforms"
      - name: Checkout upstream J2ME Loader 1.8.2
        # Same checkout as ci.yml: .gitmodules only declares the
        # submodule (no gitlink was ever committed), so a recursive
        # submodule checkout of our own repo would fetch nothing.
        uses: actions/checkout@v4
        with:
          repository: nikita36078/J2ME-Loader
          ref: "1.8.2"
          path: vendor/j2me-loader
          submodules: true
      - name: Install NDK 22.1.7171670
        # The engine builds native M3G via ndkBuild (src/main/cpp/Android.mk)
        # with ndkVersion 22.1.7171670; the preinstalled NDKs do not
        # satisfy it. Proven by the pristine build (run #2, Success).
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;22.1.7171670"
          ls "$ANDROID_HOME/ndk/22.1.7171670"
      - name: Verify engine checkout
        run: python3 tools/check-engine-pristine.py vendor/j2me-loader
      - name: Merge engine into app
        run: python3 tools/merge-engine.py vendor/j2me-loader
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Run unit tests
        # A release ships only when the tests pass (Phase 7: 73 tests).
        # Flavour tasks: the merge adds product flavours, so the plain
        # testDebugUnitTest task no longer exists; fdroid is the
        # full-emulator flavour with no Play signing requirements.
        run: ./gradlew testFdroidDebugUnitTest --stacktrace
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-fdroid-release
          path: |
            app/build/test-results/testFdroidDebugUnitTest/*.xml
            app/build/reports/tests/testFdroidDebugUnitTest/
          if-no-files-found: warn
      - name: Diagnose and normalize signing keystore
        # Diagnostic step (kept permanently, per the
        # android_pkcs12_signing skill): decode the keystore from its
        # secret, open it with the store password, list its alias and
        # key entry, and record the decoded size and hash — before any
        # signing is attempted. Secret values are never printed.
        # The keystore is then normalized to PKCS12 with the store
        # password for both store and key, exactly like the apksign
        # shared workflow does: Java ignores a separate key password
        # for PKCS12, so the private key is encrypted with the store
        # password. keystore.properties is written for the merged
        # app/build.gradle (from upstream), which loads it at Gradle
        # configuration time and signs the release buildType with it.
        # Both files live only on the runner; they are never committed.
        env:
          KS: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KS" || { echo "ERROR: ANDROID_SIGNING_KEYSTORE_BASE64 is empty. The apksign sync has not run for this repo yet (see docs/ENGINE-INTEGRATION.md §15)."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "ERROR: ANDROID_SIGNING_STORE_PASSWORD is empty."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ERROR: ANDROID_SIGNING_KEY_ALIAS is empty."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ERROR: ANDROID_SIGNING_KEY_PASSWORD is empty."; exit 1; }

          printf '%s' "$KS" | tr -d '[:space:]' | base64 --decode > release.jks
          chmod 600 release.jks
          echo "Decoded keystore: $(stat -c%s release.jks) bytes, sha256 $(sha256sum release.jks | cut -d' ' -f1)"

          if ! keytool -list -keystore release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >"$RUNNER_TEMP/keystore-list.txt" 2>"$RUNNER_TEMP/keytool-error.txt"; then
            echo "ERROR: Cannot open the signing keystore or find alias '$KEY_ALIAS'."
            head -n 3 "$RUNNER_TEMP/keytool-error.txt" || true
            exit 1
          fi
          echo "Keystore opens with the store password; alias entry:"
          cat "$RUNNER_TEMP/keystore-list.txt"

          normalized="$RUNNER_TEMP/release-signing.p12"
          imported=false
          for source_type in JKS PKCS12; do
            for source_key_password in "$KEY_PASSWORD" "$STORE_PASSWORD"; do
              rm -f "$normalized"
              if keytool -importkeystore \
                -srckeystore release.jks \
                -srcstoretype "$source_type" \
                -srcstorepass "$STORE_PASSWORD" \
                -srcalias "$KEY_ALIAS" \
                -srckeypass "$source_key_password" \
                -destkeystore "$normalized" \
                -deststoretype PKCS12 \
                -deststorepass "$STORE_PASSWORD" \
                -destalias "$KEY_ALIAS" \
                -destkeypass "$STORE_PASSWORD" \
                -noprompt >/dev/null 2>"$RUNNER_TEMP/key-password-check.log"; then
                if keytool -list -keystore "$normalized" -storetype PKCS12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
                  imported=true
                  break 2
                fi
              fi
            done
          done

          if [ "$imported" != true ]; then
            echo "ERROR: keystore decoded and store password/alias accepted, but the private key could not be imported."
            echo "Tried source formats JKS and PKCS12, with the configured key password and store password."
            echo "Verify ANDROID_SIGNING_KEY_PASSWORD matches this exact keystore. Do not replace the keystore if you need to preserve app update compatibility."
            exit 1
          fi
          chmod 600 "$normalized"
          echo "Signing keystore validated and normalized to PKCS12."

          printf 'keyAlias=%s\nkeyPassword=%s\nstoreFile=%s\nstorePassword=%s\n' \
            "$KEY_ALIAS" "$STORE_PASSWORD" "$normalized" "$STORE_PASSWORD" > keystore.properties
          chmod 600 keystore.properties
          echo "keystore.properties written (real keystore, runner-only)."
      - name: Build release APK
        # Gradle signs the release buildType with signingConfigs.release
        # (from upstream, kept by the merge script) using the
        # keystore.properties written above. The fdroid flavour has no
        # versionNameSuffix, so the APK is stamped exactly 1 / 0.1.0.
        env:
          APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
        run: ./gradlew assembleFdroidRelease --stacktrace
      - name: Install Android Build Tools 35.0.0
        # apksigner and aapt2 for the verification steps below (same
        # version the apksign shared workflow installs).
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" --install "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Verify signature and package version
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/fdroid/release -maxdepth 1 -name '*.apk' | sort | head -n 1)"
          test -n "$apk" || { echo "ERROR: no release APK under app/build/outputs/apk/fdroid/release/"; exit 1; }
          apksigner verify --verbose --print-certs "$apk"
          pkg="$(aapt2 dump badging "$apk" | head -n 1)"
          echo "$pkg"
          echo "$pkg" | grep -q "package: name='com.khahdihdz.j2meemulator'" || { echo "ERROR: wrong package name."; exit 1; }
          echo "$pkg" | grep -q "versionCode='${{ env.APP_VERSION_CODE }}'" || { echo "ERROR: wrong versionCode."; exit 1; }
          echo "$pkg" | grep -q "versionName='${{ env.APP_VERSION_NAME }}'" || { echo "ERROR: wrong versionName."; exit 1; }
          echo "APK=$apk" >> "$GITHUB_ENV"
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$APK" dist/J2ME-Emulator-signed.apk
          (cd dist && sha256sum J2ME-Emulator-signed.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Emulator-signed-apk
          path: |
            dist/J2ME-Emulator-signed.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Attach assets to the GitHub Release
        # Only on a real release event; a manual dispatch is a dry run
        # (artifacts above are still uploaded for inspection).
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/J2ME-Emulator-signed.apk dist/SHA256SUMS.txt --clobber
